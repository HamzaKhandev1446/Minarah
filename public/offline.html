<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#174f46" />
    <title>Minarah — offline</title>
    <style>
      body {
        font:
          18px/1.7 system-ui,
          sans-serif;
        background: #f7f8f4;
        color: #174f46;
        max-width: 36rem;
        margin: 12vh auto;
        padding: 24px;
      }
      a {
        color: inherit;
        display: inline-block;
        padding: 12px;
        border: 1px solid;
        border-radius: 8px;
      }
      a:focus-visible {
        outline: 3px solid #a07123;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Connect to the internet to check your mosque’s latest published Jamaat
        times. Minarah does not display cached schedules as current.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
